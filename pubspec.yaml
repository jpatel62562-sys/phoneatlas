name: phoneatlas
description: A production-quality, lightweight Flutter package for international phone number input, validation, formatting, and country selection with Unicode flag support.
version: 0.1.0
homepage: https://github.com/example/phoneatlas
repository: https://github.com/example/phoneatlas
issue_tracker: https://github.com/example/phoneatlas/issues

environment:
  sdk: ^3.13.1
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  phone_numbers_parser: ^9.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
